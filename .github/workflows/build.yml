name: Build and Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Labz.UI.slnx
      - name: Build
        run: dotnet build Labz.UI.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test Labz.UI.slnx --no-build --configuration Release
